<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#02040a"
  >

  <title>Infinity AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==============================
       HEADER
       ============================== -->

  <header class="app-header">

    <div class="header-glow"></div>

    <div class="brand">

      <div class="brand-icon">
        ✦
      </div>

      <div>
        <h1>INFINITY AI</h1>

        <span>
          NEXT-GEN INTELLIGENCE
        </span>
      </div>

    </div>

    <div class="online-status">
      <span></span>
      ONLINE
    </div>

  </header>


  <!-- ==============================
       AI CAPABILITIES
       ============================== -->

  <section class="ai-selector-area">

    <label for="aiModel">
      🧠 AI CAPABILITIES
    </label>

    <select id="aiModel">

      <option value="gemini">
        Infinity AI Core
      </option>

      <option value="deepseek">
        Deep Reasoning
      </option>

      <option value="chatgpt">
        Advanced Assistant
      </option>

      <option value="claude">
        Creative Intelligence
      </option>

      <option value="kimi">
        Long Context AI
      </option>

      <option value="perplexity">
        Web Intelligence
      </option>

    </select>

    <p id="modelStatus">
      Infinity AI Core Online ✓
    </p>

  </section>


  <!-- ==============================
       CHAT
       ============================== -->

  <main
    class="chat-container"
    id="chatContainer"
  >

    <div class="welcome-message">

      <p>
        ✨ Welcome to Infinity AI
      </p>

      <small>
        Your next-generation AI workspace.
      </small>

    </div>

  </main>


  <!-- ==============================
       INPUT AREA
       ============================== -->

  <div class="input-area">

    <!-- PLUS BUTTON -->

    <button
      id="plusBtn"
      class="plus-btn"
      type="button"
      aria-label="Open AI tools"
      aria-expanded="false"
    >
      <span>＋</span>
    </button>


    <!-- MESSAGE INPUT -->

    <input
      type="text"
      id="messageInput"
      placeholder="Ask Infinity AI anything..."
      autocomplete="off"
      enterkeyhint="send"
    >


    <!-- SEND -->

    <button
      id="sendBtn"
      type="button"
      aria-label="Send message"
    >

      <span class="send-icon">
        ➤
      </span>

    </button>

  </div>


  <!-- ==============================
       PLUS MENU
       ============================== -->

  <div
    id="plusMenuOverlay"
    class="plus-menu-overlay"
    aria-hidden="true"
  >

    <div
      id="plusMenu"
      class="plus-menu"
      role="dialog"
      aria-modal="true"
      aria-label="Infinity AI tools"
    >

      <div class="plus-menu-header">

        <div>

          <h2>
            Infinity AI
          </h2>

          <p>
            Create, attach and explore
          </p>

        </div>

        <button
          id="closePlusBtn"
          class="close-plus-btn"
          type="button"
          aria-label="Close menu"
        >
          ×
        </button>

      </div>


      <!-- IMAGE -->

      <section class="tool-section">

        <h3>📷 IMAGE</h3>

        <div class="tool-grid">

          <button
            class="tool-item"
            data-action="gallery"
            type="button"
          >
            <span>🖼️</span>
            <strong>Gallery</strong>
            <small>Available</small>
          </button>


          <button
            class="tool-item"
            data-action="camera"
            type="button"
          >
            <span>📸</span>
            <strong>Camera</strong>
            <small>Available</small>
          </button>


          <button
            class="tool-item"
            data-action="image-understanding"
            type="button"
          >
            <span>🧠</span>
            <strong>Image Understanding</strong>
            <small>Available</small>
          </button>

        </div>

      </section>


      <!-- FILES -->

      <section class="tool-section">

        <h3>📄 FILES</h3>

        <div class="tool-grid">

          <button
            class="tool-item coming-soon"
            data-action="pdf"
            type="button"
          >
            <span>📎</span>
            <strong>PDF</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="documents"
            type="button"
          >
            <span>📝</span>
            <strong>TXT / DOCX</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="spreadsheet"
            type="button"
          >
            <span>📊</span>
            <strong>XLSX / CSV</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="other-files"
            type="button"
          >
            <span>📁</span>
            <strong>Other Files</strong>
            <small>Coming Soon</small>
          </button>

        </div>

      </section>


      <!-- CREATE -->

      <section class="tool-section">

        <h3>🎨 CREATE</h3>

        <div class="tool-grid">

          <button
            class="tool-item coming-soon"
            data-action="ai-image"
            type="button"
          >
            <span>🖼️</span>
            <strong>AI Image</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="ai-video"
            type="button"
          >
            <span>🎬</span>
            <strong>AI Video</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="ai-music"
            type="button"
          >
            <span>🎵</span>
            <strong>AI Music</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="ai-voice"
            type="button"
          >
            <span>🎙️</span>
            <strong>AI Voice</strong>
            <small>Coming Soon</small>
          </button>

        </div>

      </section>


      <!-- AI TOOLS -->

      <section class="tool-section">

        <h3>🧠 AI TOOLS</h3>

        <div class="tool-grid">

          <button
            class="tool-item coming-soon"
            data-action="web-search"
            type="button"
          >
            <span>🔍</span>
            <strong>Web Search</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="summarize"
            type="button"
          >
            <span>📝</span>
            <strong>Summarize</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="translate"
            type="button"
          >
            <span>🌐</span>
            <strong>Translate</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="code"
            type="button"
          >
            <span>💻</span>
            <strong>Code</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="study"
            type="button"
          >
            <span>📚</span>
            <strong>Study / Explain</strong>
            <small>Coming Soon</small>
          </button>

        </div>

      </section>


      <!-- FUTURE -->

      <section class="tool-section">

        <h3>🚀 FUTURE</h3>

        <div class="tool-grid">

          <button
            class="tool-item coming-soon"
            data-action="location"
            type="button"
          >
            <span>📍</span>
            <strong>Location</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="voice-input"
            type="button"
          >
            <span>🎤</span>
            <strong>Voice Input</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="scan"
            type="button"
          >
            <span>📷</span>
            <strong>Scan Document</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="multiple-files"
            type="button"
          >
            <span>📑</span>
            <strong>Multiple Files</strong>
            <small>Coming Soon</small>
          </button>


          <button
            class="tool-item coming-soon"
            data-action="url-analysis"
            type="button"
          >
            <span>🔗</span>
            <strong>URL Analysis</strong>
            <small>Coming Soon</small>
          </button>

        </div>

      </section>

    </div>

  </div>


  <!-- ==============================
       BOTTOM NAV
       ============================== -->

  <nav class="bottom-nav">

    <button
      class="nav-item active"
      data-tab="chat"
      type="button"
    >
      <span class="nav-icon">💬</span>
      <span class="nav-label">Chat</span>
    </button>


    <button
      class="nav-item"
      data-tab="image"
      type="button"
    >
      <span class="nav-icon">🎨</span>
      <span class="nav-label">Image</span>
    </button>


    <button
      class="nav-item"
      data-tab="video"
      type="button"
    >
      <span class="nav-icon">🎬</span>
      <span class="nav-label">Video</span>
    </button>


    <button
      class="nav-item"
      data-tab="voice"
      type="button"
    >
      <span class="nav-icon">🎤</span>
      <span class="nav-label">Voice</span>
    </button>


    <button
      class="nav-item"
      data-tab="tools"
      type="button"
    >
      <span class="nav-icon">🛠️</span>
      <span class="nav-label">Tools</span>
    </button>

  </nav>


  <!-- ==============================
       HIDDEN FILE INPUTS
       ============================== -->

  <input
    type="file"
    id="galleryInput"
    accept="image/*"
    hidden
  >

  <input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    hidden
  >


  <script src="app.js"></script>

</body>
</html>
